version: 2

models:
  - name: stg_market_prices
    description: "Staged and cleaned daily historical asset prices"
    columns:
      - name: asset_ticker
        data_tests:
          - not_null
      - name: trading_date
        data_tests:
          - not_null

  - name: fact_asset_performance
    description: "Analytical mart with calculated 14-day simple moving averages"
    columns:
      - name: asset_ticker
        data_tests:
          - not_null
      - name: trading_date
        data_tests:
          - not_null
      - name: price_close
        data_tests:
          - not_null